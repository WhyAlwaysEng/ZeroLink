<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#07090E" />
    </radialGradient>

    <!-- Neon Cyber Gradient: Cyan to Emerald -->
    <linearGradient id="neonGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Dark Border Stroke -->
    <linearGradient id="borderStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGlow)" stroke="url(#borderStroke)" stroke-width="4" />

  <!-- Core Emblem: Stylized Geometric '0' & 'Z' with Radiant Cast Waves -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Outer Radiant Wave 1 -->
    <path d="M 60,-120 A 140,140 0 0,1 140,-40" fill="none" stroke="url(#neonGradient)" stroke-width="14" stroke-linecap="round" opacity="0.4" />

    <!-- Outer Radiant Wave 2 -->
    <path d="M 90,-150 A 180,180 0 0,1 180,-60" fill="none" stroke="url(#neonGradient)" stroke-width="12" stroke-linecap="round" opacity="0.2" />

    <!-- Main Stylized Zero / Z Monogram -->
    <!-- Top Horizontal Beam -->
    <path d="M -105,-100 L 75,-100 C 95,-100 110,-85 105,-65 L 85,-20 C 82,-12 75,-5 68,0 L -70,95 L 105,95" 
          fill="none" 
          stroke="url(#neonGradient)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Central High-Speed Pulse Dot (Zero-Latency Core) -->
    <circle cx="0" cy="0" r="14" fill="#FFFFFF" />

    <!-- Inner Wireless Signal Pulse Arc -->
    <path d="M -40,-40 A 56,56 0 0,1 40,-40" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.8" />
  </g>
</svg>
